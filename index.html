<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#00695C">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PROSPEK Équipe</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --t1:#00C9B8;--t2:#00A89A;--t3:#007A70;
  --bg:#F0FAFA;--bg2:#E0F5F4;
  --tx:#0A2E2C;--tx2:#3D6B68;--tx3:#7AADAA;
  --or:#FF6B35;--orl:#FFF0EB;
  --re:#E84040;--rel:#FFEBEE;
  --gr:#00C07A;--grl:#E6FFF4;
  --ye:#F5A623;--yel:#FFF8EC;
  --pu:#6C63FF;--pul:#F0EFFF;
  --sh:0 4px 24px rgba(0,201,184,.15);
  --sh2:0 2px 12px rgba(0,0,0,.08);
}
html,body{height:100%;font-family:'Sora',sans-serif;background:var(--bg);color:var(--tx);overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:430px;margin:0 auto;position:fixed;top:0;left:50%;transform:translateX(-50%);bottom:0;width:100%}
.topbar{background:linear-gradient(135deg,var(--t1),var(--t3));padding:12px 16px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;overflow:hidden;position:relative}
.topbar::before{content:'';position:absolute;top:-15px;right:-15px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.1)}
.app-name{font-size:19px;font-weight:800;color:white;z-index:1}
.app-sub{font-size:11px;color:rgba(255,255,255,.75);margin-top:1px}
.topbar-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;z-index:1}
.time-badge{background:rgba(255,255,255,.2);border-radius:16px;padding:3px 9px;font-size:12px;color:white;font-weight:600}
.sync-btn{font-size:11px;color:rgba(255,255,255,.85);cursor:pointer;background:rgba(255,255,255,.15);padding:2px 8px;border-radius:10px;border:none;font-family:'Sora',sans-serif}
.main{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.main::-webkit-scrollbar{display:none}
.nav{display:grid;grid-template-columns:repeat(5,1fr);background:white;border-top:1px solid #E0F5F4;flex-shrink:0;box-shadow:0 -4px 20px rgba(0,0,0,.06);padding-bottom:env(safe-area-inset-bottom,0px);position:relative;z-index:100}
.nb{padding:9px 4px 7px;text-align:center;cursor:pointer;font-size:10px;font-weight:600;color:#AAC;border:none;background:none;font-family:'Sora',sans-serif;letter-spacing:.04em;text-transform:uppercase;transition:.15s;position:relative}
.nb.on{color:var(--t1)}
.nb .ico{font-size:19px;display:block;margin-bottom:2px}
.nb.on .ico{transform:scale(1.1)}
.nb-dot{position:absolute;top:7px;right:50%;transform:translateX(8px);width:7px;height:7px;background:var(--re);border-radius:50%;border:2px solid white}
.sec{padding:14px;animation:fi .2s ease}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.hero{background:linear-gradient(135deg,var(--t1),var(--t3));border-radius:16px;padding:16px;margin-bottom:12px;color:white;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-10px;right:-10px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero-lbl{font-size:12px;font-weight:600;opacity:.8;text-transform:uppercase;letter-spacing:.07em}
.hero-val{font-size:30px;font-weight:800;margin:3px 0}
.hero-sub{font-size:11px;opacity:.7}
.hero-bar{background:rgba(255,255,255,.2);border-radius:5px;height:5px;margin:10px 0 5px;overflow:hidden}
.hero-fill{height:100%;background:white;border-radius:5px;transition:1.2s ease}
.hero-pct{font-size:12px;opacity:.75}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:white;border-radius:12px;padding:12px;box-shadow:var(--sh2)}
.stat-val{font-size:20px;font-weight:800}
.stat-lbl{font-size:11px;color:var(--tx2);margin-top:2px;font-weight:500}
.stat-ico{font-size:14px;margin-bottom:4px}
.brief{background:linear-gradient(135deg,#0A2E2C,#007A70);border-radius:16px;padding:14px;margin-bottom:12px;color:white}
.brief-ttl{font-size:12px;opacity:.7;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.brief-msg{font-size:11px;font-weight:600;line-height:1.6;margin-bottom:10px}
.brief-btn{padding:6px 14px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:8px;font-size:11px;font-weight:600;color:white;cursor:pointer;font-family:'Sora',sans-serif}
.alrt{border-radius:10px;padding:10px 12px;margin-bottom:7px;display:flex;align-items:center;gap:8px}
.alrt-ico{font-size:14px;flex-shrink:0}
.alrt-txt{font-size:11px;font-weight:600;color:var(--tx);line-height:1.4}
.stitle{font-size:12px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin:13px 0 6px;padding:0 2px}
.card{background:white;border-radius:12px;padding:12px;margin-bottom:7px;box-shadow:var(--sh2);cursor:pointer;transition:.12s}
.card:active{transform:scale(.99)}
.cu{border-left:3px solid var(--re)}
.cc{border-left:3px solid var(--or)}
.cr{border-left:3px solid var(--pu)}
.cn{border-left:3px solid var(--t1)}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cnom{font-size:12px;font-weight:700;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:185px}
.cmeta{font-size:11px;color:var(--tx2);margin-top:2px}
.bdg{padding:3px 7px;border-radius:16px;font-size:10px;font-weight:700;white-space:nowrap}
.bu{background:var(--rel);color:var(--re)}
.bc{background:var(--orl);color:var(--or)}
.br{background:var(--pul);color:var(--pu)}
.bn{background:var(--bg2);color:var(--t2)}
.bo{background:var(--grl);color:var(--gr)}
.bp{background:#F5F5F5;color:#AAA}
.cacts{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.bsm{padding:5px 9px;border-radius:7px;font-size:11px;font-weight:600;border:1.5px solid #E8F5F4;background:#F8FFFE;color:var(--t2);cursor:pointer;font-family:'Sora',sans-serif;text-decoration:none;display:inline-block}
.bsm:active{transform:scale(.95)}
.bcall{background:var(--t1);color:white;border-color:var(--t1)}
.bok{background:var(--grl);color:var(--gr);border-color:var(--gr)}
.brdv{background:var(--pul);color:var(--pu);border-color:var(--pu)}
.brel{background:var(--orl);color:var(--or);border-color:var(--or)}
.bno{background:#F5F5F5;color:#AAA;border-color:#EEE}
.fg{margin-bottom:12px}
.fl{font-size:12px;font-weight:600;color:var(--tx2);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.fi{width:100%;padding:11px 13px;border:2px solid #E0F5F4;border-radius:11px;font-size:12px;font-family:'Sora',sans-serif;color:var(--tx);background:white;transition:.15s;-webkit-appearance:none;appearance:none}
.fi:focus{outline:none;border-color:var(--t1)}
textarea.fi{resize:vertical;min-height:65px}
.bp1{width:100%;padding:13px;background:linear-gradient(135deg,var(--t1),var(--t2));color:white;border:none;border-radius:12px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Sora',sans-serif;box-shadow:var(--sh);margin-top:4px}
.bp1:active{transform:scale(.98)}
.bp2{width:100%;padding:11px;background:white;color:var(--t1);border:2px solid var(--t1);border-radius:12px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Sora',sans-serif;margin-top:6px}
.crgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}
.crstat{background:white;border-radius:11px;padding:10px;text-align:center;box-shadow:var(--sh2)}
.crstat input{width:100%;text-align:center;font-size:26px;font-weight:800;color:var(--t1);border:none;background:none;font-family:'Sora',sans-serif;padding:3px 0}
.crstat input:focus{outline:none}
.crstat-lbl{font-size:10px;color:var(--tx2);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.rbox{background:var(--bg2);border:2px solid var(--t1);border-radius:12px;padding:12px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--tx);line-height:1.8;white-space:pre-wrap;margin:8px 0;max-height:180px;overflow-y:auto}
.bcopy{width:100%;padding:11px;background:white;color:var(--t1);border:2px solid var(--t1);border-radius:11px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Sora',sans-serif}
.toast{position:fixed;bottom:75px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--tx);color:white;padding:9px 18px;border-radius:18px;font-size:11px;font-weight:600;z-index:999;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;max-width:90%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.srch{background:white;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:8px;margin-bottom:10px;box-shadow:var(--sh2);border:2px solid transparent;transition:.2s}
.srch:focus-within{border-color:var(--t1)}
.srch input{flex:1;border:none;font-family:'Sora',sans-serif;font-size:13px;color:var(--tx);background:none;padding:4px 0;min-height:36px}
.srch input:focus{outline:none}
.srch input::placeholder{color:var(--tx3);font-size:11px}
.srch-clear{font-size:16px;cursor:pointer;color:var(--tx3);padding:4px;flex-shrink:0}
.chips{display:flex;gap:5px;overflow-x:auto;padding-bottom:3px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:4px 11px;border-radius:18px;font-size:11px;font-weight:600;border:1.5px solid #E0F5F4;background:white;color:var(--tx2);cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:'Sora',sans-serif}
.chip.on{background:var(--t1);color:white;border-color:var(--t1)}
.obj{background:white;border-radius:12px;padding:12px;margin-bottom:8px;box-shadow:var(--sh2)}
.obj-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:5px 0;border-bottom:1px solid var(--bg2)}
.obj-row:last-child{border-bottom:none}
.obj-k{color:var(--tx2)}
.obj-v{font-weight:700;color:var(--t1)}
.irow{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid var(--bg2);font-size:11px}
.ik{color:var(--tx2)}
.iv{font-weight:700;color:var(--tx);text-align:right;max-width:55%}
.bck{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--t2);cursor:pointer;background:none;border:none;font-family:'Sora',sans-serif;margin-bottom:12px;font-weight:600}
.dhdr{background:linear-gradient(135deg,var(--t1),var(--t3));border-radius:14px;padding:16px;color:white;margin-bottom:12px}
.obs{background:var(--yel);border-radius:11px;padding:11px;margin:8px 0;font-size:11px;color:var(--tx);line-height:1.6}
.tag{display:inline-block;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:700;margin:2px}
.tag-rappel{background:var(--pul);color:var(--pu)}
.tag-perdu{background:#F5F5F5;color:#888}
.tag-chaud{background:var(--orl);color:var(--or)}

/* Styles supplémentaires équipe */
.login-wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;background:linear-gradient(135deg,#004D40,#00897B)}
.login-card{background:white;border-radius:20px;padding:28px 22px;max-width:400px;margin:0 auto;width:100%}
.login-logo{font-size:36px;font-weight:800;color:white;text-align:center;margin-bottom:4px;letter-spacing:-1px}
.login-sub{font-size:12px;color:rgba(255,255,255,.8);text-align:center;margin-bottom:28px}
.login-err{background:#FFEBEE;color:#C62828;border-radius:10px;padding:10px;font-size:12px;font-weight:600;margin-bottom:12px;display:none;text-align:center}
.badge-feu{background:#FFF3E0;color:#E65100;border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700}
.badge-forme{background:#E8F5E9;color:#2E7D32;border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700}
.badge-boost{background:#FFEBEE;color:#C62828;border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700}
.rank-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bg2);cursor:pointer}
.rank-item:last-child{border-bottom:none}
.rank-num{font-size:18px;font-weight:800;color:#DDD;width:28px;text-align:center;flex-shrink:0}
.rank-num.top1{color:#F5A623}
.rank-num.top2{color:#9E9E9E}
.rank-num.top3{color:#795548}
.bar-w{height:4px;background:var(--bg2);border-radius:3px;margin-top:4px}
.bar-v{height:4px;background:linear-gradient(90deg,var(--t1),var(--t2));border-radius:3px;transition:width .6s}
.cat-badge{font-size:9px;padding:2px 8px;border-radius:8px;font-weight:700;margin-left:6px}
.cat-leader{background:#FFF3E0;color:#E65100}
.cat-challenger{background:#E8EAF6;color:#3949AB}
.cat-avenir{background:#E8F5E9;color:#2E7D32}
.cat-debutant{background:#F3E5F5;color:#7B1FA2}
.chef-note{background:#FFFDE7;border-left:3px solid #F5A623;border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:11px}
.alert-item{padding:10px 12px;border-left:3px solid var(--re);background:var(--rel);border-radius:8px;margin-bottom:6px;font-size:11px}
.alert-item.vert{border-left-color:var(--gr);background:var(--grl)}
.alert-item.or{border-left-color:var(--or);background:var(--orl)}
.config-wrap{padding:20px 16px;max-width:480px;margin:0 auto}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
// ============================================================
// CONFIG
// ============================================================
var SHEETS_URL_EQ='https://script.google.com/macros/s/AKfycbwDsuanGIVoabNfg6xVwCd9U74WDjMSy__QlXQowU_CAjKcJYRq1HfCtiPXPB2CVnRDgg/exec';
var API_TOKEN_EQ='PROSPEK_EQUIPE_2026_SUNU';
var OBJECTIF_DEFAUT=1000000;
var TODAY=new Date().toISOString().slice(0,10);

// Catégories SUNU avec objectifs par défaut (modifiables par la cheffe)
var CATEGORIES={
  'Leader':    {couleur:'cat-leader',    objectifMensuel:500000, contratsHebdo:5, caHebdo:125000, sunu:'500 000 FCFA/mois | 5 contrats/sem'},
  'Challenger':{couleur:'cat-challenger',objectifMensuel:400000, contratsHebdo:5, caHebdo:100000, sunu:'400 000 FCFA/mois | 5 contrats/sem'},
  'Avenir':    {couleur:'cat-avenir',    objectifMensuel:320000, contratsHebdo:5, caHebdo:80000,  sunu:'320 000 FCFA/mois | 5 contrats/sem'},
  'Debutant':  {couleur:'cat-debutant',  objectifMensuel:104000, contratsHebdo:3, caHebdo:26000,  sunu:'104 000 FCFA/mois | 3 contrats/sem'}
};

var CATS_PAR_NOM={
  'HOUEDANOU':'Leader',
  'KPATOUKPA':'Leader',
  'GNIMAGNON':'Leader',
  'GODONOU':'Challenger',
  'KOUGBLA':'Challenger',
  'TOSSAVI':'Challenger',
  'SODO':'Challenger',
  'KINHO':'Challenger',
  'AGBESSI':'Avenir',
  'KPONSO':'Avenir',
  'AGNILO':'Avenir',
  'AVOCE':'Avenir',
  'DEGBEY':'Avenir',
  'KPEKPEDE':'Avenir',
  'SINZOGAN':'Avenir',
  'AVIMADJENON':'Avenir',
  'ATINDEHOU':'Avenir',
  'MARCOS':'Avenir',
  'TITO':'Avenir',
  'LAWSON':'Avenir',
  'FANOU':'Debutant',
  'ANAGONOU':'Debutant',
  'AGOSSOU':'Debutant',
  'GBAGUIDI':'Avenir',
  'GOUBALY':'Avenir',
  'ADJOBO':'Avenir',
  'KAKESSA':'Avenir',
  'QUENUM':'Avenir',
};
// ============================================================
// ÉTAT APPLICATION
// ============================================================
var S={
  logged:false, code:'', nom:'', prenom:'', role:'commercial',
  onglet:'', categorie:'Challenger', objectifPerso:OBJECTIF_DEFAUT,
  view:'accueil', prevView:'accueil',
  contrats:[], prospects:[], equipe:[], commissions:[],
  totalComm:0, streakJours:0, configured:false
};

// Restaurer session
var sess=load('eq_sess',null);
if(sess&&sess.code){
  Object.assign(S,sess);
  S.contrats=load('eq_contrats',[]);
  S.prospects=load('eq_prospects',[]);
  S.equipe=load('eq_equipe',[]);
  S.commissions=load('eq_comm',[]);
  S.totalComm=load('eq_totalComm',0);
}

// ============================================================
// UTILITAIRES
// ============================================================
function fmt(n){return Math.round(n).toLocaleString('fr-FR')+' FCFA';}
function fp(p){if(!p)return'';var v=(p+'').replace(/\s/g,'');if(v&&v[0]!='0'&&v[0]!='+')v='0'+v;return v;}
function load(k,def){try{var s=localStorage.getItem(k);return s?JSON.parse(s):def;}catch(e){return def;}}



// CONTRATS chargés depuis Sheets (ou fallback local)

// Charger les contrats depuis Sheets - TOUJOURS priorité Sheets
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function toast(m){
  var t=document.getElementById('toast');
  t.textContent=m;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2500);
}

function calcComm(prod,prime,dur){
  if(!prod)return 0;
  dur=dur||10;
  var p=prod.toLowerCase();
  if(p.indexOf('td')>=0||p.indexOf('3cap')>=0)return Math.round(prime*0.10);
  if(p.indexOf('fonds')>=0||p.indexOf('capi')>=0)return Math.round(prime*0.015);
  if(p.indexOf('hr5')>=0)return Math.round(prime*0.019);
  var taux=p.indexOf('mixte')>=0?0.0193:0.019;
  return Math.round(prime*Math.min(dur,15)*12*taux/12);
}


function sGet(action,extra){
  extra=extra||'';
  return fetch(SHEETS_URL_EQ+'?action='+action+'&token='+API_TOKEN_EQ+'&code='+S.code+extra);
}
function sPost(action,data){
  data=data||{};
  data.token=API_TOKEN_EQ;
  data.code=S.code;
  data.action=action;
  return fetch(SHEETS_URL_EQ,{method:'POST',body:JSON.stringify(data)})
    .then(function(r){return r.json();}).catch(function(){return {success:false};});
}
function navTo(v){S.prevView=S.view;S.view=v;render();}
function updateTime(){
  var el=document.getElementById('htime');
  if(!el)return;
  var d=new Date(),h=d.getHours(),m=d.getMinutes();
  var p=h<12?'Matin':h<17?'Apres-midi':h<21?'Soir':'Nuit';
  el.textContent=p+' '+h+'h'+(m<10?'0':'')+m;
}
setInterval(updateTime,30000);

function getBadge(totalComm,objectif,streakJ){
  var pct=objectif>0?totalComm/objectif:0;
  if(pct>=0.8&&streakJ>=3)return{cls:'badge-feu',txt:' En feu'};
  if(pct>=0.5)return{cls:'badge-forme',txt:' En forme'};
  return{cls:'badge-boost',txt:' A booster'};
}

function getStreakDays(){
  var dernier=load('eq_last_activity','');
  var streak=load('eq_streak',0);
  var hier=new Date();hier.setDate(hier.getDate()-1);
  var hierStr=hier.toISOString().slice(0,10);
  if(dernier===TODAY)return streak;
  if(dernier===hierStr)return streak;
  return 0;
}
function marquerActivite(){
  var s=getStreakDays();
  var dernier=load('eq_last_activity','');
  var hier=new Date();hier.setDate(hier.getDate()-1);
  if(dernier===hier.toISOString().slice(0,10))s++;
  else if(dernier!==TODAY)s=1;
  save('eq_last_activity',TODAY);
  save('eq_streak',s);
  S.streakJours=s;
}

// ============================================================
// CHARGEMENT DONNÉES
// ============================================================
function charger(){
  // Ne pas ecraser l'ecran de config
  if(!S.configured&&S.role!=='manager')return;
  // Contrats
  sGet('getContrats')
    .then(function(r){return r.json();})
    .then(function(res){
      if(res.success){
        S.contrats=res.contrats||[];
        S.totalComm=res.totalComm||0;
        save('eq_contrats',S.contrats);
        save('eq_totalComm',S.totalComm);
        if(S.configured&&(S.view==='accueil'||S.view==='bilan'))renderMain();
      }
    }).catch(function(){});
  // Prospects
  sGet('getProspects')
    .then(function(r){return r.json();})
    .then(function(res){
      if(res.success){
        S.prospects=res.prospects||[];
        save('eq_prospects',S.prospects);
        if(S.configured&&S.view==='pipeline')renderMain();
      }
    }).catch(function(){});
  // Équipe si manager/admin
  if(S.role==='manager'||S.role==='admin'){
    sGet('getEquipe')
      .then(function(r){return r.json();})

          S.equipe=res.equipe||[];
          save('eq_equipe',S.equipe);
          if(S.view==='equipe')renderMain();
        }
      }).catch(function(){});
  }
  // Commissions
  sGet('getCommissions')
    .then(function(r){return r.json();})
    .then(function(res){
      if(res.success&&res.commissions){
        S.commissions=res.commissions;
        save('eq_comm',S.commissions);
      }
    }).catch(function(){});
}

    +'<span class="'+badge.cls+'" style="font-size:9px;padding:2px 8px">'+badge.txt+'</span>'

function renderLogin(){
  document.getElementById('app').innerHTML=
    '<div class="login-wrap">'
    +'<div class="login-logo">PROSPEK</div>'
    +'<div class="login-sub">Système Équipe · UP3</div>'
    +'<div class="login-card">'
    +'<div class="login-err" id="lerr">Code invalide. Contacte ton responsable.</div>'
    +'<div class="fg"><label class="fl">Ton code de connexion</label>'
    +'<input class="fi" id="lcode" type="text" placeholder="Ex: GILDAS2026" '
    +'style="text-transform:uppercase;font-size:18px;text-align:center;letter-spacing:2px" autocomplete="off"></div>'
    +'<button class="bp1" onclick="doLogin()" id="lbtn">Se connecter</button>'
    +'<div style="font-size:10px;color:#AAA;text-align:center;margin-top:14px">'
    +'Pas de code ? Contacte KPEKPEDE GRACE</div>'
    +'</div></div>';

  var inp=document.getElementById('lcode');
  if(inp){
    inp.addEventListener('input',function(){this.value=this.value.toUpperCase();});
    inp.addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
    inp.focus();
  }
}

function doLogin(){
  var inp=document.getElementById('lcode');
  var code=(inp?inp.value:'').trim().toUpperCase();
  if(!code)return;
  var btn=document.getElementById('lbtn');
  if(btn){btn.textContent='Connexion...';btn.disabled=true;}

  fetch(SHEETS_URL_EQ+'?action=login&token='+API_TOKEN_EQ+'&code='+code)
    .then(function(r){return r.json();})
    .then(function(res){
      if(res.success){
        S.logged=true;S.code=code;
        S.nom=res.nom||code;S.onglet=res.onglet||code;
        S.role=res.role||'commercial';
        S.prenom=S.nom.split(' ')[0];
        // Vérifier si déjà configuré
        var cfg=load('eq_cfg_'+code,null);
        if(cfg){S.categorie=cfg.cat||'Challenger';S.objectifPerso=cfg.obj||OBJECTIF_DEFAUT;S.configured=true;}
        else{
          // Détecter la catégorie automatiquement selon le nom
          var nomUpper=(res.nom||'').toUpperCase();
          for(var k in CATS_PAR_NOM){
            if(nomUpper.indexOf(k)>=0){S.categorie=CATS_PAR_NOM[k];break;}
          }
          S.objectifPerso=CATEGORIES[S.categorie]?CATEGORIES[S.categorie].objectifMensuel:OBJECTIF_DEFAUT;
          S.configured=(S.role==='manager');
        }
        saveSess();
        toast('Bienvenue '+S.prenom+' !');
        charger();
        render();
      }else{
        var err=document.getElementById('lerr');
        if(err)err.style.display='block';
        if(btn){btn.textContent='Se connecter';btn.disabled=false;}
      }
    }).catch(function(){
      var err=document.getElementById('lerr');
      if(err){err.style.display='block';err.textContent='Erreur réseau. Vérifie ta connexion.';}
      if(btn){btn.textContent='Se connecter';btn.disabled=false;}
    });
}

function saveSess(){
  save('eq_sess',{logged:S.logged,code:S.code,nom:S.nom,prenom:S.prenom,
    role:S.role,onglet:S.onglet,categorie:S.categorie,
    objectifPerso:S.objectifPerso,configured:S.configured});
}

function deconnecter(){
  if(!confirm('Se déconnecter ?'))return;
  localStorage.removeItem('eq_sess');
  S.logged=false;S.code='';S.configured=false;
  S.contrats=[];S.prospects=[];S.equipe=[];
  render();
}

function prevCommEq(){
  var p=parseInt((document.getElementById('c-prime')||{}).value||0);

function ajouterProspect(){
  var nom=((document.getElementById('a-nom')||{}).value||'').trim().toUpperCase();
  if(!nom){toast('Nom obligatoire');return;}
  var cat=((document.getElementById('a-cat')||{}).value||'');
  var data={
    nom:nom,tel:fp((document.getElementById('a-tel')||{}).value||''),
    src:(document.getElementById('a-src')||{}).value||'',
    prod:(document.getElementById('a-prod')||{}).value||'REP NF',
    obs:(document.getElementById('a-obs')||{}).value||'',
    categorie:cat,statut:'nouveau'
  };
  var p={id:'p'+Date.now(),nom:nom,tel:data.tel,src:data.src+'('+cat+')',
    st:'nouveau',prod:data.prod,obs:'['+TODAY+'] '+(data.obs||'Ajoute depuis PROSPEK'),rel:''};
  S.prospects.unshift(p);
  save('eq_prospects',S.prospects);
  sPost('addProspect',data).then(function(){toast(nom+' ajouté !');});
  addMode=0;navTo('pipeline');
}

function ajouterContrat(){
  var nom=((document.getElementById('c-nom')||{}).value||'').trim().toUpperCase();
  var prime=parseInt((document.getElementById('c-prime')||{}).value||0);
  var duree=parseInt((document.getElementById('c-duree')||{}).value||15);
  var prod=((document.getElementById('c-prod')||{}).value)||'REP NF';
  if(!nom||!prime||!duree){toast('Remplis tous les champs obligatoires');return;}
  var comm=calcComm(prod,prime,duree);
  var date=((document.getElementById('c-date')||{}).value)||TODAY;
  var effet=((document.getElementById('c-effet')||{}).value)||date;
  var stAuto=effet<=TODAY?'Actif':'Attente';
  var c={nom:nom,produit:prod,prime:prime,duree:duree,comm:comm,
    statut:stAuto,date:date,dateEffet:effet,
    tel:fp((document.getElementById('c-tel')||{}).value||''),
    bia:(document.getElementById('c-bia')||{}).value||''};
  S.contrats.push(c);
  S.totalComm+=comm;
  save('eq_contrats',S.contrats);
  save('eq_totalComm',S.totalComm);
  sPost('addContrat',c).then(function(){toast(nom+' — '+fmt(comm)+'/mois !');});
  addMode=0;navTo('bilan');
}

function rCommissions(){
  var moisNoms=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];
  var annee=new Date().getFullYear();
  var moisActuel=new Date().getMonth();
  var totalBrut=S.commissions.reduce(function(s,m){return s+(m.montant||0);},0);
  var totalNet=Math.round(totalBrut*0.95);
  var h='<div class="sec">';

  h+='<div class="hero">'
    +'<div class="hero-label">Total commissions reçues '+annee+'</div>'
    +'<div class="hero-val">'+fmt(totalBrut)+'</div>'
    +'<div class="hero-sub">Net après AIB 5%: '+fmt(totalNet)+'</div>'
    +'</div>';

  h+='<div class="card" style="padding:0">';
  for(var m=0;m<=moisActuel;m++){
    var moisKey=annee+'-'+(m<9?'0':'')+(m+1);
    var entree=S.commissions.find(function(x){return x.mois===moisKey;});
    var reelle=entree?entree.montant:0;
    var aib=Math.round(reelle*0.05);
    var net=reelle-aib;
    h+='<div style="padding:12px 14px;border-bottom:1px solid var(--bg2)">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'
      +'<span style="font-size:13px;font-weight:700">'+moisNoms[m]+' '+annee+'</span>'
      +(reelle>0?'<span style="font-size:11px;font-weight:700;color:var(--gr)">Net: '+fmt(net)+'</span>'
        :'<span style="font-size:10px;color:var(--tx3)">Non saisi</span>')+'</div>';
    if(reelle>0){
      h+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">'
        +'<div style="background:var(--bg2);border-radius:8px;padding:6px;text-align:center">'
        +'<div style="font-size:9px;color:var(--tx3)">Brut actuaires</div>'
        +'<div style="font-size:12px;font-weight:700;color:var(--t1)">'+Math.round(reelle).toLocaleString()+'</div></div>'
        +'<div style="background:var(--rel);border-radius:8px;padding:6px;text-align:center">'
        +'<div style="font-size:9px;color:var(--re)">AIB 5%</div>'
        +'<div style="font-size:12px;font-weight:700;color:var(--re)">-'+Math.round(aib).toLocaleString()+'</div></div>'
        +'<div style="background:var(--grl);border-radius:8px;padding:6px;text-align:center">'
        +'<div style="font-size:9px;color:var(--gr)">Net reçu</div>'
        +'<div style="font-size:12px;font-weight:700;color:var(--gr)">'+Math.round(net).toLocaleString()+'</div></div>'
        +'</div>';
    }
    h+='</div>';
  }
  h+='</div>';

  // Saisir commission
  h+='<div class="stitle">SAISIR COMMISSION CE MOIS</div>'
    +'<div class="card">'
    +'<div style="font-size:11px;color:var(--tx2);margin-bottom:10px">Saisis le montant brut reçu des actuaires → AIB 5% calculé automatiquement</div>'
    +'<div style="display:flex;gap:8px;margin-bottom:8px">'
    +'<input id="cm-val" type="number" placeholder="Montant brut..." style="flex:1;padding:11px;border:2px solid var(--bg2);border-radius:10px;font-size:15px;font-family:Sora,sans-serif" oninput="prevAIB()">'
    +'<button onclick="saveCommEq()" style="padding:11px 16px;background:var(--t1);color:white;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:Sora,sans-serif"> OK</button>'
    +'</div>'
    +'<div id="aib-p" style="display:none;background:var(--bg2);border-radius:10px;padding:10px">'
    +'<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px"><span>Brut</span><span id="aib-b" style="font-weight:700"></span></div>'
    +'<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px;color:var(--re)"><span>AIB 5%</span><span id="aib-m"></span></div>'
    +'<div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--gr)"><span>Net</span><span id="aib-n"></span></div>'
    +'</div></div>';

  h+='<div class="pb"></div></div>';
  return h;
}

function prevAIB(){
  var brut=parseInt((document.getElementById('cm-val')||{}).value||0);
  if(brut>0){
    var aib=Math.round(brut*0.05);
    var prev=document.getElementById('aib-p');
    if(prev)prev.style.display='block';
    var b=document.getElementById('aib-b'),m=document.getElementById('aib-m'),n=document.getElementById('aib-n');
    if(b)b.textContent=brut.toLocaleString()+' FCFA';
    if(m)m.textContent='-'+aib.toLocaleString()+' FCFA';
    if(n)n.textContent=(brut-aib).toLocaleString()+' FCFA';
  }
}

function saveCommEq(){
  var brut=parseInt((document.getElementById('cm-val')||{}).value||0);
  if(!brut){toast('Montant invalide');return;}
  var aib=Math.round(brut*0.05);
  var net=brut-aib;
  var mois=TODAY.slice(0,7);
  var idx=S.commissions.findIndex(function(c){return c.mois===mois;});
  var entry={mois:mois,montant:brut,aib:aib,net:net};
  if(idx>=0)S.commissions[idx]=entry;
  else S.commissions.push(entry);
  save('eq_comm',S.commissions);
  sPost('saveCommission',{mois:mois,montant:brut,aib:aib,net:net,estime:S.totalComm});
  toast('Brut: '+fmt(brut)+' | Net: '+fmt(net));
  renderMain();
}

function rAlertes(){

    h+='<div class="card" style="text-align:center;padding:20px;color:var(--tx2)">Chargement de l equipe...</div>';

      if(!m.contrats||m.contrats===0){
        alertes.push({nom:m.nom,msg:'Aucun contrat enregistré — À accompagner',type:'rouge'});

        alertes.push({nom:m.nom,msg:m.contrats+' contrat(s) mais 0 actif — Vérifier les prélèvements',type:'or'});

    if(felicitations.length>0){
      h+='<div class="stitle" style="color:var(--gr)">À FÉLICITER 🎉</div>';
      felicitations.forEach(function(a){
        h+='<div class="alert-item vert"><strong>'+a.nom.split(' ')[0]+'</strong> — '+a.msg+'</div>';
      });
    }
    if(alertes.length>0){
      h+='<div class="stitle" style="color:var(--re)">À ACCOMPAGNER ⚠️</div>';
      alertes.forEach(function(a){
        h+='<div class="alert-item '+(a.type==='or'?'or':'')+'">'

// ============================================================
// RETOUR ANDROID
// ============================================================
window.history.pushState({},'',window.location.href);
window.addEventListener('popstate',function(){
  if(S.view!=='accueil'){navTo('accueil');}
  else window.history.pushState({},'',window.location.href);
});

// ============================================================
// INIT
// ============================================================
render();
if(S.logged){setTimeout(charger,1000);}
</script>
